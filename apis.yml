aid: cadasto
name: Cadasto
description: >-
  Cadasto B.V. is a Dutch health-IT company (Alkmaar, Netherlands) that builds a vendor-neutral
  Clinical Data Repository on the openEHR standard. The Cadasto CDR stores structured care data
  as openEHR compositions and exposes the openEHR ITS-REST 1.0.3 API surface — EHR, Query
  (AQL), Definition, Demographic, Admin and System — plus a Cadasto-specific Additional API for
  Datamap (a simplified JSON projection of openEHR paths), episodes of care and terminology
  helpers, a bidirectional FHIR R3 facade, and SMART-on-openEHR app launch. Access is OAuth 2.0
  client-credentials per tenant. Cadasto also publishes an unusually strong agent surface for
  its size: a live anonymous MCP server for openEHR modelling knowledge, eight packaged Agent
  Skills, a Claude Code plugin marketplace, an llms.txt, and a public openEHR conformance
  statement naming every specification version it does and does not implement.
