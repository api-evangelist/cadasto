apis:
- name: openEHR Assistant MCP Server
  description: >-
    Cadasto's live, hosted, anonymous Model Context Protocol server for openEHR modelling work: 12 tools
    (CKM archetype and template search/get, openEHR terminology resolution, BMM type specification search/get,
    bundled guide and example search/get), 14 guided prompts, 50 resources and 3 resource templates under
    openehr:// URIs. Streamable HTTP. Probed live on 2026-09-02 — initialize and tools/list both returned
    200 with no credentials.
  humanURL: https://cadasto.github.io/openehr-assistant/
  baseURL: https://openehr-assistant-mcp.apps.cadasto.com/
  tags:
  - MCP
  - openEHR
  - Agents
  - Clinical Modeling
  - Healthcare
