  responses:
    404_unknown_ehr_id_or_version_uid:
      description: '`404 Not Found` is returned when an EHR with `ehr_id` does not exist, or when the `version_uid` does not exist.

        '
    409_EHR_STATUS_cadasto_person_uid:
      description: '`409 Conflict` is returned when the `cadasto-person-uid` header cannot be honoured on the update.

        Possible causes:

        - The target EHR already has a link to a PERSON. The header is **append-only** on `PUT /ehr/{ehr_id}/ehr_status` — to re-link, delete and recreate the EHR.

        - The supplied PERSON is already linked to another EHR.

        '
    '400':
      description: '`400 Bad Request` is returned when the request URL or body (if provided) could not be parsed or has invalid content.

        '
    200_VERSION_at_time:
      description: '`200 OK` is returned when the requested VERSION is successfully retrieved.

        '
      headers:
        ETag:
          $ref: '#/components/headers/ETag_VERSION'
        Location:
          $ref: '#/components/headers/Location_VERSIONED_EHR_STATUS_VERSION'
        openehr-item-tag:
          $ref: '#/components/headers/openehr-item-tag'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UVersion'
    204_EHR_STATUS:
      description: '`204 No Content` is returned when the `Prefer` header is missing or is set to `return=minimal`.

        '
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
        Location:
          $ref: '#/components/headers/Location_EHR_STATUS'
        openehr-item-tag:
          $ref: '#/components/headers/openehr-item-tag'
    422_cadasto_person_uid_unknown:
      description: '`422 Unprocessable Entity` is returned when the supplied `cadasto-person-uid` does not resolve to an existing PERSON in the Demographic API, or resolves to a non-PERSON actor (Organisation, Agent, Group, Role).

        '
    404_unknown_ehr_id_or_no_version_at_time:
      description: '`404 Not Found` is returned when an EHR with `ehr_id` does not exist, or when a version of the resource identified by the request parameters (at specified `version_at_time`) does not exist.

        '
    200_VERSION:
      description: '`200 OK` is returned when the requested VERSION is successfully retrieved.

        '
      headers:
        openehr-item-tag:
          $ref: '#/components/headers/openehr-item-tag'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UVersion'
    200_EHR_STATUS_retrieved:
      description: '`200 OK` is returned when the requested EHR_STATUS is successfully retrieved.

        '
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
        Location:
          $ref: '#/components/headers/Location_EHR_STATUS'
        openehr-item-tag:
          $ref: '#/components/headers/openehr-item-tag'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EhrStatus'
    200_EHR_STATUS_updated:
      description: '`200 OK` is returned when the EHR_STATUS is successfully updated, and the updated resource is returned in the body when `Prefer` header value is `return=representation`.

        '
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
        Location:
          $ref: '#/components/headers/Location_EHR_STATUS'
        openehr-item-tag:
          $ref: '#/components/headers/openehr-item-tag'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EhrStatus'
    412_EHR_STATUS:
      description: '`412 Precondition Failed` is returned when `If-Match` request header doesn''t match the latest version on the service side.

        Returns also latest `version_uid` in the `Location` and `ETag` headers.

        '
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
        Location:
          $ref: '#/components/headers/Location_EHR_STATUS'
    200_VERSIONED_EHR_STATUS:
      description: '`200 OK` is returned when the requested VERSIONED_EHR_STATUS is successfully retrieved.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/VersionedEhrStatus'
    400_invalid_version_at_time:
      description: '`400 Bad Request` is returned when the request has invalid content such as an invalid `version_at_time` format.

        '
    404_unknown_ehr_id:
      description: '`404 Not Found` is returned when an EHR with `ehr_id` does not exist.

        '
    200_REVISION_HISTORY:
      description: '`200 OK` is returned when the requested REVISION_HISTORY is successfully retrieved.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RevisionHistory'
  headers:
    Location_EHR_STATUS:
      description: 'The `Location` response header indicates the URL of the EHR_STATUS resource.

        '
      schema:
        type: string
        format: url
        examples:
        - https://cataniamc.prod.cadasto.com/v1/ehr/7d44b88c-4199-4bad-97dc-d78268e01398/ehr_status/6cb19121-4307-4648-9da0-d62e4d51f19b::cataniamc.prod.cadasto.com::2
    ETag:
      description: 'The `ETag` (i.e. entity tag) response header is an identifier (e.g. a `version_uid` enclosed by double quotes) for a specific version of a resource.

        '
      schema:
        type: string
        examples:
        - '"6cb19121-4307-4648-9da0-d62e4d51f19b::cataniamc.prod.cadasto.com::2"'
    ETag_VERSION:
      description: 'The `ETag` (i.e. entity tag) response header is the VERSION identifier (i.e. the `version_uid`) enclosed by double quotes.

        '
      schema:
        type: string
        examples:
        - '"6cb19121-4307-4648-9da0-d62e4d51f19b::cataniamc.prod.cadasto.com::2"'
    Location_VERSIONED_EHR_STATUS_VERSION:
      description: 'The `Location` response header indicates the URL of the VERSION resource.

        '
      schema:
        type: string
        format: url
        examples:
        - https://cataniamc.prod.cadasto.com/v1/ehr/7d44b88c-4199-4bad-97dc-d78268e01398/versioned_ehr_status/version/6cb19121-4307-4648-9da0-d62e4d51f19b::cataniamc.prod.cadasto.com::1
    openehr-item-tag:
      description: "The list of ITEM_TAG resources associated with the current versioned object,\nemitted as a JSON array.\n\n**When this header is emitted:**\n- On write endpoints (`POST` create, `PUT` update) — automatically, when the\n  request carried an `openehr-item-tag` header (tag-aware request → tag-aware\n  response) and the response uses `return=representation`. To force inclusion\n  on a write that did not send tags, add `Prefer: include_item_tags`.\n- On read endpoints (`GET`) — only when the client opts in by sending\n  `Prefer: include_item_tags`. Without the opt-in the additional tag lookup is\n  skipped and the header is omitted entirely.\n\nThe header is also omitted when the resource has no tags.\n\n> **Cadasto exception:** the `openehr-version-item-tag` response header — used by\n> upstream openEHR to convey VERSION-scoped tags — is **never emitted** by Cadasto.\n> All tags are scoped to the versioned object as a whole.\n"
      schema:
        type: string
      examples:
        default:
          value: '[{"key":"flag","value":"follow-up","target_path":"/composition/start_time/value"}]'
  parameters:
    cadasto-person-uid:
      name: cadasto-person-uid
      in: header
      description: 'Links the EHR being created (or updated via EHR_STATUS) to an existing PERSON

        in the [Demographic API](/demographic-api). The link is written in the same

        contribution as the EHR/EHR_STATUS write.


        > **Cadasto extension:** this header is not part of the

        > [openEHR ITS-REST](https://specifications.openehr.org/releases/ITS-REST/latest/ehr.html)

        > specification. Standard openEHR clients can continue to use

        > `EHR_STATUS.subject.external_ref` and `GET /ehr?subject_id=…&subject_namespace=…`

        > instead; the two mechanisms are independent and can coexist. See the

        > [Cadasto demographic link guide](/docs/guides/cadasto-demographic-link).


        Value must be a **bare** PERSON UID in the

        [HIER_OBJECT_ID](https://specifications.openehr.org/releases/BASE/latest/base_types.html#_hier_object_id_class)

        form (no `::<system>::<version>` suffix). Versioned forms are rejected with

        `400 Bad Request`.


        On `PUT /ehr/{ehr_id}/ehr_status` the link is **append-only** — an EHR that

        already has a link cannot be re-linked via this header and the request is

        rejected with `409 Conflict`.

        '
      required: false
      style: simple
      schema:
        type: string
        format: uuid
      examples:
        default:
          value: 7d44b88c-4199-4bad-97dc-d78268e01398
    If-Match:
      name: If-Match
      in: header
      description: "Header to make the request conditional. \nTogether with `ETag` request tag, it helps to prevent simultaneous updates of a resource from overwriting each other (\"mid-air collisions\").\nThe format is always an `version_uid` identifier enclosed by double quotes.\nThe operation will be performed only if the existing latest `version_uid` of the resource (i.e. the `preceding_version_uid`) matches this header's value.\n"
      required: true
      style: simple
      schema:
        type: string
        examples:
        - '"6cb19121-4307-4648-9da0-d62e4d51f19b::cataniamc.prod.cadasto.com::1"'
    version_at_time:
      name: version_at_time
      in: query
      description: 'A given time in the extended ISO 8601 format.

        '
      style: form
      explode: true
      schema:
        type: string
        examples:
        - '2015-01-20T19:30:22.765+01:00'
    openehr-item-tag:
      name: openehr-item-tag
      in: header
      description: 'The list of ITEM_TAG resources to associate with the current versioned object,

        committed in the same transaction as the create/update.


        Two interchangeable formats are accepted:

        - **JSON (recommended)** — same shape as the `/tags` endpoint body

        - **Spec semicolon format** — `key="...",value="..."; key="...",value="...",target_path="..."`


        > **Cadasto exception:** the `openehr-version-item-tag` request header — used by

        > upstream openEHR to scope tags to a single VERSION — is **not supported** by

        > Cadasto and will be rejected with `400 Bad Request`. Tags are always scoped to

        > the versioned object. See the

        > [item_tags guide](/docs/guides/item-tag) for details and error formats.

        '
      required: false
      style: simple
      explode: true
      schema:
        type: array
        items:
          $ref: '#/components/schemas/UpdateItemTag'
      examples:
        default:
          value: '[{"key":"flag","value":"follow-up","target_path":"/composition/start_time/value"}]'
    ehr_id:
      name: ehr_id
      in: path
      description: 'EHR identifier taken from EHR.ehr_id.value.

        '
      required: true
      style: simple
      schema:
        type: string
        examples:
        - 7d44b88c-4199-4bad-97dc-d78268e01398
    version_uid:
      name: version_uid
      in: path
      description: 'VERSION identifier taken from VERSION.uid.value.

        '
      required: true
      style: simple
      schema:
        type: string
        examples:
        - 6cb19121-4307-4648-9da0-d62e4d51f19b::cataniamc.prod.cadasto.com::2
    Prefer:
      name: Prefer
      in: header
      description: 'RFC 7240 preference header. Multiple tokens may be sent in a single header as a

        comma-separated list (e.g. `Prefer: return=representation, include_item_tags`)

        or as repeated headers. Cadasto recognises the following tokens:


        | Token | Where it applies | Effect |

        |-------|------------------|--------|

        | `return=representation` | write endpoints | Return the full updated resource in the response body. |

        | `return=minimal` (default on writes) | write endpoints | Empty response body. |

        | `include_item_tags` *(Cadasto extension)* | read endpoints, and write endpoints when the request does not already carry an `openehr-item-tag` header | Emit the `openehr-item-tag` response header with the current tags. On writes that ship `openehr-item-tag` in the request, the token is implied — the response always echoes the tags. Omitted by default on reads. See the [ITEM_TAG guide](/docs/guides/item-tag) for details. |


        The `Preference-Applied` response header echoes the tokens the server actually honoured (`return=`, plus `include_item_tags` / `resolve_refs` when applied).

        '
      required: false
      style: simple
      schema:
        type: string
        examples:
        - return=representation, include_item_tags
