openapi: 3.2.0
info:
  title: Definition ADL1.4 API
  version: latest
  x-status: STABLE
  x-spec: definition
  description: Management of AOM and ADL 1.4 Operational Templates (OPTs).
servers:
- url: https://{baseUrl}/v1
  description: An example openEHR server URL.
  variables:
    baseUrl:
      default: cataniamc.prod.cadasto.com
      description: The (example) server base URL prefix providing openEHR services. This may contain server name, port and base path prefix.
security: []
tags:
- name: ADL1.4
  x-displayName: ADL1.4 TEMPLATE
  description: Management of AOM and ADL 1.4 Operational Templates (OPTs).
paths:
  /definition/template/adl1.4:
    post:
      operationId: definition_template_adl1.4_upload
      summary: Upload a template
      description: Upload a new ADL 1.4 operational template (OPT).
      tags:
      - ADL1.4
      parameters:
      - $ref: '#/components/parameters/Prefer'
      requestBody:
        description: ''
        content:
          application/xml:
            schema:
              oneOf:
              - $ref: '#/components/schemas/OperationalTemplate'
              - type: string
            examples:
              default:
                value: "<template xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\" xmlns=\"http://schemas.openehr.org/v1\">\n    <language>\n        <terminology_id>\n            <value>ISO_639-1</value>\n        </terminology_id>\n        <code_string>en</code_string>\n    </language>\n    <description>\n        <original_author id=\"Original Author\">Not Specified</original_author>\n        <lifecycle_state>Initial</lifecycle_state>\n        <other_details id=\"MetaDataSet:Sample Set \">Template metadata sample set</other_details>\n        <other_details id=\"Acknowledgements\"></other_details>\n        <other_details id=\"Business Process Level\"></other_details>\n        <other_details id=\"Care setting\"></other_details>\n        <other_details id=\"Client group\"></other_details>\n        <other_details id=\"Clinical Record Element\"></other_details>\n        <other_details id=\"Copyright\"></other_details>\n        <other_details id=\"Issues\"></other_details>\n        <other_details id=\"Owner\"></other_details>\n        <other_details id=\"Sign off\"></other_details>\n        <other_details id=\"Speciality\"></other_details>\n        <other_details id=\"User roles\"></other_details>\n        <details>\n            <language>\n                <terminology_id>\n                    <value>ISO_639-1</value>\n                </terminology_id>\n                <code_string>en</code_string>\n            </language>\n            <purpose>Not Specified</purpose>\n        </details>\n    </description>\n    <uid>\n        <value>b4d7f203-b329-4e89-a58a-c605b19e94de</value>\n    </uid>\n    <template_id>\n        <value>Vital Signs</value>\n    </template_id>\n    <concept>Vital Signs</concept>\n    <definition>\n        <rm_type_name>COMPOSITION</rm_type_name>\n        <occurrences>\n            <lower_included>true</lower_included>\n            <upper_included>true</upper_included>\n            <lower_unbounded>false</lower_unbounded>\n            <upper_unbounded>false</upper_unbounded>\n            <lower>1</lower>\n            <upper>1</upper>\n        </occurrences>\n        <node_id>at0000</node_id>\n        ..."
        required: true
      responses:
        '201':
          $ref: '#/components/responses/201_Template_adl1_4_upload'
        '400':
          $ref: '#/components/responses/400_invalid_template_content'
        '409':
          $ref: '#/components/responses/409_template_already_exists'
    get:
      operationId: definition_template_adl1.4_list
      summary: List templates
      description: List the available ADL 1.4 operational templates (OPT) on the system.
      tags:
      - ADL1.4
      responses:
        '200':
          $ref: '#/components/responses/200_TemplateList_adl1_4'
  /definition/template/adl1.4/{template_id}:
    get:
      operationId: definition_template_adl1.4_get
      summary: Get a template
      description: 'Retrieves the ADL 1.4 operational template (OPT) identified by `template_id` identifier.


        Note that this can return either the original (canonical) `XML` based OPT format (if called with the `Accept: application/xml` request header), as well as the simplified `JSON`-based “web template” format (if called with the `Accept: application/openehr.wt+json` request header). For more details see the data representation specification.'
      tags:
      - ADL1.4
      parameters:
      - $ref: '#/components/parameters/template_id'
      - $ref: '#/components/parameters/Accept_template'
      responses:
        '200':
          $ref: '#/components/responses/200_Template_adl1_4_retrieved'
        '400':
          $ref: '#/components/responses/400_invalid_template_id'
        '404':
          $ref: '#/components/responses/404_unknown_template_id'
        '406':
          $ref: '#/components/responses/406'
  /definition/template/adl1.4/{template_id}/example:
    get:
      operationId: definition_template_adl1.4_example_get
      summary: Example composition from template
      description: Generated an example COMPOSITION instance based on the ADL 1.4 operational template (OPT) identified by `template_id` identifier.
      tags:
      - ADL1.4
      parameters:
      - $ref: '#/components/parameters/template_id'
      responses:
        '200':
          $ref: '#/components/responses/200_ExampleComposition_generated'
        '404':
          $ref: '#/components/responses/404_unknown_template_id_or_version'
components:
  schemas:
    Tree:
      title: Tree
      required:
      - id
      - name
      - localizedName
      - rmType
      - nodeId
      - min
      - max
      - localizedNames
      - localizedDescriptions
      - aqlPath
      - children
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        localizedName:
          type: string
        rmType:
          type: string
        nodeId:
          type: string
        min:
          type: integer
          format: int32
        max:
          type: integer
          format: int32
        localizedNames:
          $ref: '#/components/schemas/LocalizedNames'
        localizedDescriptions:
          $ref: '#/components/schemas/LocalizedDescriptions'
        aqlPath:
          type: string
        children:
          type: array
          items:
            $ref: '#/components/schemas/Child'
    TermBindings:
      title: TermBindings
      required:
      - SNOMED-CT
      type: object
      properties:
        SNOMED-CT:
          $ref: '#/components/schemas/SNOMEDCT'
      examples:
      - SNOMED-CT:
          value: '163030003'
          terminologyId: SNOMED-CT(2003)
    Precision:
      title: Precision
      required:
      - minOp
      - min
      - maxOp
      - max
      type: object
      properties:
        minOp:
          type: string
        min:
          type: integer
          format: int32
        maxOp:
          type: string
        max:
          type: integer
          format: int32
      examples:
      - minOp: '>='
        min: 1
        maxOp: <=
        max: 1
    Input:
      title: Input
      required:
      - type
      type: object
      properties:
        type:
          type: string
        suffix:
          type: string
        list:
          type: array
          items:
            $ref: '#/components/schemas/List'
          description: ''
        defaultValue:
          type: string
        validation:
          $ref: '#/components/schemas/Validation1'
      examples:
      - type: TEXT
    Annotations1:
      title: Annotations1
      type: object
      properties:
        comment:
          type: string
        view:pass_through:
          type: string
      examples:
      - comment: 'Perloff D, Grim C, Flack J, Frohlich ED, Hill M, McDonald M, Morgenstern BZ. Human blood pressure determination by sphygmomanometry. Circulation 1993;88;2460-2470. '
    Child1:
      title: Child1
      required:
      - id
      - name
      - rmType
      - min
      - max
      - aqlPath
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        localizedName:
          type: string
        rmType:
          type: string
        nodeId:
          type: string
        min:
          type: integer
          format: int32
        max:
          type: integer
          format: int32
        localizedNames:
          $ref: '#/components/schemas/LocalizedNames1'
        localizedDescriptions:
          $ref: '#/components/schemas/LocalizedDescriptions'
        aqlPath:
          type: string
        children:
          type: array
          items:
            $ref: '#/components/schemas/Child2'
          description: ''
        inputs:
          type: array
          items:
            $ref: '#/components/schemas/Input2'
          description: ''
        inContext:
          type: boolean
        dependsOn:
          type: array
          items:
            type: string
          description: ''
        annotations:
          $ref: '#/components/schemas/Annotations1'
        termBindings:
          $ref: '#/components/schemas/TermBindings'
        proportionTypes:
          type: array
          items:
            type: string
          description: ''
      examples:
      - id: context_detail
        name: Context detail
        localizedName: Context detail
        rmType: CLUSTER
        nodeId: openEHR-EHR-CLUSTER.context_detail.v1
        min: 0
        max: -1
        localizedNames:
          sl: Podrobnosti
        localizedDescriptions:
          sl: Dodatni podatki o kontekstu
        aqlPath: /context/other_context[at0001]/items[openEHR-EHR-CLUSTER.context_detail.v1]
        children:
        - id: tags
          name: Tags
          localizedName: Tags
          rmType: DV_TEXT
          nodeId: at0008
          min: 1
          max: -1
          localizedNames:
            sl: Tagi
          localizedDescriptions:
            sl: '*'
          annotations:
            comment: Tags applied to the composition. They can contain various ids, such as episode id, central case id or other types of information forming composition meta-data.
          aqlPath: /context/other_context[at0001]/items[openEHR-EHR-CLUSTER.context_detail.v1]/items[at0008]/value
          inputs:
          - type: TEXT
    Child3:
      title: Child3
      required:
      - id
      - localizedName
      - rmType
      - nodeId
      - min
      - max
      - localizedNames
      - localizedDescriptions
      - aqlPath
      - inputs
      type: object
      properties:
        id:
          type: string
        localizedName:
          type: string
        rmType:
          type: string
        nodeId:
          type: string
        min:
          type: integer
          format: int32
        max:
          type: integer
          format: int32
        localizedNames:
          $ref: '#/components/schemas/LocalizedNames1'
        localizedDescriptions:
          $ref: '#/components/schemas/LocalizedDescriptions'
        aqlPath:
          type: string
        inputs:
          type: array
          items:
            $ref: '#/components/schemas/Input1'
          description: ''
        name:
          type: string
      examples:
      - id: count_value
        localizedName: Size
        rmType: DV_COUNT
        nodeId: ''
        min: 0
        max: 1
        localizedNames:
          sl: Velikost
        localizedDescriptions:
          sl: Velikost naprave
        aqlPath: /content[openEHR-EHR-OBSERVATION.blood_pressure.v1]/protocol[at0011]/items[openEHR-EHR-CLUSTER.device.v1]/items[at0016]/value
        inputs:
        - type: INTEGER
    LocalizedDescriptions:
      title: LocalizedDescriptions
      required:
      - sl
      type: object
      properties:
        sl:
          type: string
      examples:
      - sl: Generic encounter or progress note composition
    Input2:
      title: Input2
      required:
      - type
      type: object
      properties:
        type:
          type: string
        suffix:
          type: string
        list:
          type: array
          items:
            $ref: '#/components/schemas/List1'
          description: ''
      examples:
      - type: DATETIME
    Range:
      title: Range
      required:
      - minOp
      - min
      type: object
      properties:
        minOp:
          type: string
        min:
          type: integer
          format: int32
        maxOp:
          type: string
        max:
          type: integer
          format: int32
      examples:
      - minOp: '>='
        min: 0
        maxOp: <
        max: 1000
    TemplateMetadata:
      title: TemplateMetadata
      required:
      - template_id
      - concept
      - archetype_id
      - created_timestamp
      type: object
      properties:
        template_id:
          type: string
        version:
          type: string
        concept:
          type: string
        archetype_id:
          type: string
        created_timestamp:
          type: string
      description: Uploaded TEMPLATE meta information.
      examples:
      - template_id: openEHR-EHR-COMPOSITION.t_vital_signs.v1.0.0
        version: 1.0.1
        concept: Vital Signs
        archetype_id: openEHR-EHR-COMPOSITION.encounter.v1
        created_timestamp: '2017-08-14T19:24:56.639Z'
    Validation1:
      title: Validation1
      required:
      - range
      type: object
      properties:
        range:
          $ref: '#/components/schemas/Range'
        precision:
          $ref: '#/components/schemas/Precision'
      examples:
      - range:
          minOp: '>='
          min: 0
          maxOp: <
          max: 1000
        precision:
          minOp: '>='
          min: 0
          maxOp: <=
          max: 0
    LocalizedNames2:
      title: LocalizedNames2
      required:
      - sl
      type: object
      properties:
        sl:
          type: string
        en:
          type: string
      examples:
      - sl: Tagi
    WebTemplate:
      title: WebTemplate
      required:
      - templateId
      - version
      - defaultLanguage
      - languages
      - tree
      type: object
      properties:
        templateId:
          type: string
        version:
          type: string
        defaultLanguage:
          type: string
        languages:
          type: array
          items:
            type: string
        tree:
          $ref: '#/components/schemas/Tree'
    Input1:
      title: Input1
      required:
      - type
      type: object
      properties:
        type:
          type: string
        suffix:
          type: string
      examples:
      - type: INTEGER
    LocalizedNames1:
      title: LocalizedNames1
      required:
      - sl
      type: object
      properties:
        sl:
          type: string
      examples:
      - sl: Podrobnosti
    LocalizedNames:
      title: LocalizedNames
      required:
      - en
      type: object
      properties:
        en:
          type: string
      examples:
      - en: Vital Signs
    OperationalTemplate:
      title: OPERATIONAL_TEMPLATE
      type: object
      xml:
        name: response200
    TemplateList:
      title: TemplateList
      type: array
      items:
        $ref: '#/components/schemas/TemplateMetadata'
      description: 'List of uploaded TEMPLATE resources.

        '
    Annotations:
      title: Annotations
      type: object
      properties:
        comment:
          type: string
        default:
          type: string
      examples:
      - comment: Tags applied to the composition. They can contain various ids, such as episode id, central case id or other types of information forming composition meta-data.
    SNOMEDCT:
      title: SNOMEDCT
      required:
      - value
      - terminologyId
      type: object
      properties:
        value:
          type: string
        terminologyId:
          type: string
      examples:
      - value: '163030003'
        terminologyId: SNOMED-CT(2003)
    Child2:
      title: Child2
      required:
      - id
      - name
      - localizedName
      - rmType
      - nodeId
      - min
      - max
      - localizedNames
      - localizedDescriptions
      - aqlPath
      - inputs
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        localizedName:
          type: string
        rmType:
          type: string
        nodeId:
          type: string
        min:
          type: integer
          format: int32
        max:
          type: integer
          format: int32
        localizedNames:
          $ref: '#/components/schemas/LocalizedNames2'
        localizedDescriptions:
          $ref: '#/components/schemas/LocalizedDescriptions'
        annotations:
          $ref: '#/components/schemas/Annotations'
        aqlPath:
          type: string
        inputs:
          type: array
          items:
            $ref: '#/components/schemas/Input'
          description: ''
        dependsOn:
          type: array
          items:
            type: string
          description: ''
        inContext:
          type: boolean
        termBindings:
          $ref: '#/components/schemas/TermBindings'
        children:
          type: array
          items:
            $ref: '#/components/schemas/Child3'
          description: ''
      examples:
      - id: tags
        name: Tags
        localizedName: Tags
        rmType: DV_TEXT
        nodeId: at0008
        min: 1
        max: -1
        localizedNames:
          sl: Tagi
        localizedDescriptions:
          sl: '*'
        annotations:
          comment: Tags applied to the composition. They can contain various ids, such as episode id, central case id or other types of information forming composition meta-data.
        aqlPath: /context/other_context[at0001]/items[openEHR-EHR-CLUSTER.context_detail.v1]/items[at0008]/value
        inputs:
        - type: TEXT
    Input3:
      title: Input3
      required:
      - suffix
      - type
      type: object
      properties:
        suffix:
          type: string
        type:
          type: string
        list:
          type: array
          items:
            $ref: '#/components/schemas/List2'
          description: ''
        terminology:
          type: string
      examples:
      - suffix: code
        type: CODED_TEXT
        list:
        - value: '433'
          label: event
          localizedLabels:
            sl: ''
        terminology: openehr
    List2:
      title: List2
      required:
      - value
      - label
      - localizedLabels
      type: object
      properties:
        value:
          type: string
        label:
          type: string
        localizedLabels:
          $ref: '#/components/schemas/LocalizedLabels'
      examples:
      - value: '433'
        label: event
        localizedLabels:
          sl: ''
    Validation:
      title: Validation
      type: object
      properties:
        precision:
          $ref: '#/components/schemas/Precision'
        range:
          $ref: '#/components/schemas/Range'
      examples:
      - precision:
          minOp: '>='
          min: 1
          maxOp: <=
          max: 1
    List:
      title: List
      required:
      - value
      - label
      type: object
      properties:
        value:
          type: string
        label:
          type: string
        validation:
          $ref: '#/components/schemas/Validation'
        localizedLabels:
          $ref: '#/components/schemas/LocalizedLabels'
        localizedDescriptions:
          $ref: '#/components/schemas/LocalizedDescriptions'
      examples:
      - value: °C
        label: °C
        validation:
          precision:
            minOp: '>='
            min: 1
            maxOp: <=
            max: 1
    LocalizedLabels:
      title: LocalizedLabels
      required:
      - sl
      type: object
      properties:
        sl:
          type: string
      examples:
      - sl: Gol
    List1:
      title: List1
      required:
      - value
      - label
      - localizedLabels
      - localizedDescriptions
      type: object
      properties:
        value:
          type: string
        label:
          type: string
        localizedLabels:
          $ref: '#/components/schemas/LocalizedLabels'
        localizedDescriptions:
          $ref: '#/components/schemas/LocalizedDescriptions'
      examples:
      - value: at0022
        label: Mouth
        localizedLabels:
          sl: Usta
        localizedDescriptions:
          sl: '*Temperature is measured within the mouth(en)'
    Child:
      title: Child
      required:
      - id
      - rmType
      - min
      - max
      - aqlPath
      type: object
      properties:
